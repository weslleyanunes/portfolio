<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv='cache-control' content='no-cache'> 
  <meta http-equiv='expires' content='0'> 
  <meta http-equiv='pragma' content='no-cache'>

  <title>
    {% if page.title == "Home" %}
      {{ site.title }} &middot; {{ site.tagline }}
    {% else %}
      {{ page.title }} &middot; {{ site.title }}
    {% endif %}
  </title>

  <link rel="stylesheet" href="{{ site.baseurl }}/styles.css">
  <link rel="shortcut icon" href="{{ site.baseurl }}/public/favicon.png">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ site.baseurl }}/atom.xml">
  <meta name="theme-color" content="#ea8229">
  
  <style>
    .accessibility-controls {
      position: fixed;
      top: 50%;
      left: 1.5rem;
      transform: translateY(-50%);
      z-index: 1001;
    }

    .accessibility-controls ul {
      list-style: none;
      padding: 0;
      margin: 0;
      text-align: left;
    }

    .accessibility-controls li {
      display: block;
      margin-bottom: 1.5rem;
    }

    .accessibility-btn {
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }

    .accessibility-btn i {
      font-size: 28px;
      color: #2d2c2a;
      transition: color 0.2s;
      display: block;
      line-height: 1;
    }

    .accessibility-btn:hover i {
      color: #fff;
    }

    .accessibility-btn.active i {
      color: #2d2c2a;
    }

    .accessibility-btn:focus {
      outline: 2px solid rgba(234, 130, 41, 0.4);
      outline-offset: 2px;
    }

    .accessibility-btn.disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .accessibility-btn.disabled:hover i {
      color: #2d2c2a;
    }

    @media only screen and (max-width: 40em) {
      .accessibility-controls {
        top: auto;
        bottom: 1rem;
        left: 1rem;
        transform: none;
      }
      
      .accessibility-controls ul {
        text-align: center;
      }
      
      .accessibility-controls li {
        display: inline-block;
        margin-bottom: 0;
        padding-right: 1rem;
      }
    }

    .tts-highlight {
      position: relative;
    }

    .tts-highlight::after {
      content: '';
      position: absolute;
      top: -4px;
      left: -4px;
      right: -4px;
      bottom: -4px;
      border: 2px solid #ea8229;
      border-radius: 4px;
      animation: tts-pulse 1.5s infinite;
      pointer-events: none;
    }

    @keyframes tts-pulse {
      0%, 100% {
        opacity: 0.3;
        transform: scale(1);
      }
      50% {
        opacity: 0.8;
        transform: scale(1.02);
      }
    }

    .tts-enabled {
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
    }

    /* Hover genérico para textos */
    .tts-enabled:hover {
      color: #ffffff;
      background-color: #2d2c2a;
      border-radius: 4px;
      padding: 2px 4px;
    }

    /* Estilo especial para intro-code, footer-code e copyright */
    .intro-code.tts-enabled:hover,
    .footer-code.tts-enabled:hover,
    .footer-code h2.tts-enabled:hover,
    .footer-code p.tts-enabled:hover,
    .copyright.tts-enabled:hover {
      background-color: #2d2c2a !important;
      color: #ffffff !important;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 4px 15px rgba(45, 44, 42, 0.3);
      margin: 5px 0;
    }

    /* Garantir que todos os elementos dentro das seções ficam brancos */
    .intro-code.tts-enabled:hover *,
    .footer-code.tts-enabled:hover *,
    .footer-code h2.tts-enabled:hover *,
    .footer-code p.tts-enabled:hover *,
    .copyright.tts-enabled:hover * {
      color: #ffffff !important;
    }

    /* Estilo especial para o "Hello!" */
    .intro-code.tts-enabled:hover .hello-text,
    .intro-code.tts-enabled:hover h1 {
      color: #ffffff !important;
    }

    /* Links dentro das seções com hover */
    .intro-code.tts-enabled:hover a,
    .footer-code.tts-enabled:hover a,
    .footer-code h2.tts-enabled:hover a,
    .footer-code p.tts-enabled:hover a,
    .copyright.tts-enabled:hover a {
      color: #ffffff !important;
      text-decoration: underline;
    }

    /* Highlighting quando elemento está sendo lido */
    .tts-highlight {
      background-color: #2d2c2a !important;
      color: #ffffff !important;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 4px 20px rgba(45, 44, 42, 0.4);
      transform: scale(1.02);
      transition: all 0.3s ease;
      margin: 5px 0;
    }

    .tts-highlight * {
      color: #ffffff !important;
    }

    .tts-highlight a {
      color: #ffffff !important;
      text-decoration: underline;
    }

    /* Highlighting especial para elementos menores como copyright */
    .copyright.tts-highlight,
    .footer-code h2.tts-highlight,
    .footer-code p.tts-highlight {
      transform: scale(1.01);
      margin: 8px 0;
    }
  </style>
</head>
